<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Loading...</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      width: 100vw;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      user-select: none;
      -webkit-font-smoothing: antialiased;
    }

    /* 主卡片：纯白与高透毛玻璃结合 */
    .splash-card {
      width: 360px;
      height: 250px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px) saturate(180%);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      border-radius: 28px;
      box-shadow: 
        0 20px 50px rgba(0, 0, 0, 0.06),
        0 0 0 1px rgba(255, 255, 255, 0.8) inset;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 32px 32px 32px;
      position: relative;
      overflow: hidden; /* 隐藏溢出的水泡光晕 */
    }

    /* ================= 弥散光水泡背景层 ================= */
    .ambient-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: -1;
      pointer-events: none;
      filter: blur(35px); /* 高斯模糊实现弥散效果 */
      opacity: 0.85;
    }

    .bubble {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: multiply;
    }

    /* 水泡 1：梦幻紫粉渐变 */
    .bubble-1 {
      width: 160px;
      height: 160px;
      background: radial-gradient(circle, rgba(255, 182, 193, 0.8) 0%, rgba(216, 191, 216, 0.5) 100%);
      top: -30px;
      left: -20px;
      animation: floatBubble1 8s ease-in-out infinite alternate;
    }

    /* 水泡 2：天空蔚蓝渐变 */
    .bubble-2 {
      width: 180px;
      height: 180px;
      background: radial-gradient(circle, rgba(161, 196, 253, 0.8) 0%, rgba(194, 233, 251, 0.5) 100%);
      bottom: -40px;
      right: -20px;
      animation: floatBubble2 10s ease-in-out infinite alternate;
    }

    /* 水泡 3：暖阳浅金渐变 */
    .bubble-3 {
      width: 130px;
      height: 130px;
      background: radial-gradient(circle, rgba(255, 236, 179, 0.7) 0%, rgba(255, 209, 128, 0.4) 100%);
      top: 40%;
      left: 30%;
      animation: floatBubble3 7s ease-in-out infinite alternate;
    }

    /* 水泡浮动轨迹动画 */
    @keyframes floatBubble1 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(50px, 40px) scale(1.15); }
    }

    @keyframes floatBubble2 {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(-40px, -30px) scale(1.1); }
    }

    @keyframes floatBubble3 {
      0% { transform: translate(0, 0) scale(0.9); }
      100% { transform: translate(-20px, 30px) scale(1.2); }
    }

    /* ================= 内容元素样式 ================= */
    
    .brand-icon {
      width: 44px;
      height: 44px;
      background: #ffffff;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #111111;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.6);
    }

    .brand-icon svg {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
    }

    .text-group {
      text-align: center;
    }

    .title {
      font-size: 16px;
      color: #1d1d1f;
      font-weight: 600;
      letter-spacing: -0.2px;
      margin-bottom: 4px;
    }

    .subtitle {
      font-size: 12px;
      color: #6e6e73;
      font-weight: 400;
    }

    /* 极细微半透明进度条 */
    .loader-track {
      width: 120px;
      height: 3px;
      background: rgba(0, 0, 0, 0.05);
      border-radius: 3px;
      overflow: hidden;
      position: relative;
    }

    .loader-bar {
      width: 40%;
      height: 100%;
      background: linear-gradient(90deg, #a1c4fd, #c2e9fb);
      border-radius: 3px;
      position: absolute;
      animation: ambientLoading 1.8s ease-in-out infinite;
    }

    @keyframes ambientLoading {
      0% { left: -40%; }
      50% { left: 50%; width: 50%; }
      100% { left: 100%; }
    }
  </style>
</head>
<body>

  <div class="splash-card">
    <!-- 背景水泡弥散光层 -->
    <div class="ambient-container">
      <div class="bubble bubble-1"></div>
      <div class="bubble bubble-2"></div>
      <div class="bubble bubble-3"></div>
    </div>

    <!-- 图标 -->
    <div class="brand-icon">
      <svg viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="9"></circle>
        <path d="M12 3a9 9 0 0 0 0 18 linear"></path>
      </svg>
    </div>

    <!-- 标题 -->
    <div class="text-group">
      <div class="subtitle">正在初始化...</div>
    </div>

    <!-- 进度条 -->
    <div class="loader-track">
      <div class="loader-bar"></div>
    </div>
  </div>

</body>
</html>
